name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./data/ci.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AUTH_SECRET: ci-only-not-a-production-secret-value
      PAYMENT_PROVIDER: development
      EMAIL_PROVIDER: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
